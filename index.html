<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal Citation Bluebook/AGLC Formatter</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="max-w-3xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold text-gray-900 mb-1">Legal Citation Formatter</h1>
  <p class="text-sm text-gray-500 mb-6">Generate Bluebook (US) or AGLC (Australian) citations for cases, books, journal articles, and statutes.</p>

  <div class="bg-white rounded-xl shadow p-6 mb-6">
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="sourceType">Source Type</label>
        <select id="sourceType" onchange="renderFields()" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="case">Case</option>
          <option value="book">Book</option>
          <option value="journal">Journal Article</option>
          <option value="statute">Statute</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="formatType">Citation Format</label>
        <select id="formatType" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="bluebook">Bluebook (US)</option>
          <option value="aglc">AGLC (Australian)</option>
        </select>
      </div>
    </div>

    <div id="fields" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4"></div>

    <button onclick="generateCitation()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition text-sm">Generate Citation</button>

    <div id="output" class="hidden mt-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Generated Citation</label>
      <div class="flex gap-2">
        <div id="citation-text" class="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm font-mono text-gray-800 min-h-12 whitespace-pre-wrap"></div>
        <button onclick="copyCitation()" class="shrink-0 bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg text-sm font-medium transition">Copy</button>
      </div>
      <p id="copy-msg" class="text-xs text-green-600 mt-1 hidden">Copied to clipboard!</p>
    </div>
  </div>

  <div id="recent-section" class="hidden bg-white rounded-xl shadow p-6">
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-base font-semibold text-gray-800">Recent Citations</h2>
      <button onclick="clearRecent()" class="text-xs text-red-500 hover:text-red-700">Clear</button>
    </div>
    <div id="recent-list" class="space-y-2"></div>
  </div>
</div>

<script>
const FIELDS = {
  case: [
    { id: 'parties', label: 'Case Name (Parties)', placeholder: 'Brown v. Board of Education' },
    { id: 'volume', label: 'Volume', placeholder: '347' },
    { id: 'reporter', label: 'Reporter', placeholder: 'U.S.' },
    { id: 'page', label: 'First Page', placeholder: '483' },
    { id: 'court', label: 'Court', placeholder: 'USSC' },
    { id: 'year', label: 'Year', placeholder: '1954' },
  ],
  book: [
    { id: 'author', label: 'Author(s)', placeholder: 'John H. Doe' },
    { id: 'title', label: 'Title', placeholder: 'Contract Law' },
    { id: 'edition', label: 'Edition', placeholder: '3rd' },
    { id: 'publisher', label: 'Publisher', placeholder: 'Oxford UP' },
    { id: 'year', label: 'Year', placeholder: '2020' },
    { id: 'page', label: 'Page (optional)', placeholder: '145' },
  ],
  journal: [
    { id: 'author', label: 'Author(s)', placeholder: 'Jane Smith' },
    { id: 'title', label: 'Article Title', placeholder: 'The Future of Tort Law' },
    { id: 'volume', label: 'Volume', placeholder: '42' },
    { id: 'journal', label: 'Journal Name', placeholder: 'Harvard Law Review' },
    { id: 'page', label: 'First Page', placeholder: '101' },
    { id: 'year', label: 'Year', placeholder: '2022' },
  ],
  statute: [
    { id: 'title', label: 'Statute Title', placeholder: 'Sherman Antitrust Act' },
    { id: 'volume', label: 'Title/Volume', placeholder: '15' },
    { id: 'code', label: 'Code (e.g. U.S.C.)', placeholder: 'U.S.C.' },
    { id: 'section', label: 'Section', placeholder: '1' },
    { id: 'year', label: 'Year', placeholder: '2018' },
    { id: 'jurisdiction', label: 'Jurisdiction (AGLC)', placeholder: 'Cth' },
  ]
};

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function getVal(id) {
  const el = document.getElementById('f-' + id);
  return el ? el.value.trim() : '';
}

function renderFields() {
  const type = document.getElementById('sourceType').value;
  const container = document.getElementById('fields');
  container.innerHTML = '';
  FIELDS[type].forEach(f => {
    const div = document.createElement('div');
    const label = document.createElement('label');
    label.htmlFor = 'f-' + f.id;
    label.className = 'block text-sm font-medium text-gray-700 mb-1';
    label.textContent = f.label;
    const input = document.createElement('input');
    input.type = 'text';
    input.id = 'f-' + f.id;
    input.placeholder = f.placeholder;
    input.className = 'w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500';
    div.appendChild(label);
    div.appendChild(input);
    container.appendChild(div);
  });
}

function generateCitation() {
  const type = document.getElementById('sourceType').value;
  const fmt = document.getElementById('formatType').value;
  let citation = '';

  if (type === 'case') {
    const parties = getVal('parties');
    const vol = getVal('volume');
    const rep = getVal('reporter');
    const pg = getVal('page');
    const court = getVal('court');
    const year = getVal('year');
    if (fmt === 'bluebook') {
      citation = `${parties}, ${vol} ${rep} ${pg} (${court} ${year}).`;
    } else {
      citation = `${parties} (${year}) ${vol} ${rep} ${pg}.`;
    }
  } else if (type === 'book') {
    const author = getVal('author');
    const title = getVal('title');
    const ed = getVal('edition');
    const pub = getVal('publisher');
    const year = getVal('year');
    const pg = getVal('page');
    if (fmt === 'bluebook') {
      citation = `${author.toUpperCase()}, ${title.toUpperCase()} ${pg ? pg + ' ' : ''}(${ed ? ed + ' ed., ' : ''}${pub} ${year}).`;
    } else {
      citation = `${author}, ${title} (${pub}, ${ed ? ed + ' ed, ' : ''}${year})${pg ? ' ' + pg : ''}.`;
    }
  } else if (type === 'journal') {
    const author = getVal('author');
    const title = getVal('title');
    const vol = getVal('volume');
    const journal = getVal('journal');
    const pg = getVal('page');
    const year = getVal('year');
    if (fmt === 'bluebook') {
      citation = `${author}, ${title}, ${vol} ${journal.toUpperCase()} ${pg} (${year}).`;
    } else {
      citation = `${author}, '${title}' (${year}) ${vol} ${journal} ${pg}.`;
    }
  } else if (type === 'statute') {
    const title = getVal('title');
    const vol = getVal('volume');
    const code = getVal('code');
    const sec = getVal('section');
    const year = getVal('year');
    const jur = getVal('jurisdiction');
    if (fmt === 'bluebook') {
      citation = `${title}, ${vol} ${code} § ${sec} (${year}).`;
    } else {
      citation = `${title} ${year} (${jur || 'Cth'}) s ${sec}.`;
    }
  }

  const el = document.getElementById('citation-text');
  el.textContent = citation;
  document.getElementById('output').classList.remove('hidden');

  // Save to recent
  const recent = JSON.parse(localStorage.getItem('legal-citations') || '[]');
  recent.unshift({ type, fmt, citation, ts: Date.now() });
  if (recent.length > 20) recent.pop();
  localStorage.setItem('legal-citations', JSON.stringify(recent));
  renderRecent();
}

function copyCitation() {
  const text = document.getElementById('citation-text').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const msg = document.getElementById('copy-msg');
    msg.classList.remove('hidden');
    setTimeout(() => msg.classList.add('hidden'), 2000);
  });
}

function renderRecent() {
  const recent = JSON.parse(localStorage.getItem('legal-citations') || '[]');
  if (recent.length === 0) { document.getElementById('recent-section').classList.add('hidden'); return; }
  document.getElementById('recent-section').classList.remove('hidden');
  const list = document.getElementById('recent-list');
  list.innerHTML = '';
  recent.forEach((r, i) => {
    const div = document.createElement('div');
    div.className = 'flex items-start gap-2 bg-gray-50 rounded-lg px-3 py-2';
    const badge = document.createElement('span');
    badge.className = 'shrink-0 text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded font-medium mt-0.5';
    badge.textContent = r.fmt.toUpperCase();
    const text = document.createElement('span');
    text.className = 'text-sm text-gray-700 font-mono flex-1';
    text.textContent = r.citation;
    div.appendChild(badge);
    div.appendChild(text);
    list.appendChild(div);
  });
}

function clearRecent() {
  localStorage.removeItem('legal-citations');
  renderRecent();
}

renderFields();
renderRecent();
</script>
</body>
</html>
